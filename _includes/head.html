{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Apply the stored theme before the stylesheet loads so pages never flash the wrong theme.
  // Dark is the default; only an explicit "light" choice (saved by the header toggle) changes it.
  (function () {
    var theme = 'dark';
    try { if (localStorage.getItem('theme') === 'light') { theme = 'light'; } } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
